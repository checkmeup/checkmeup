  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }

  .empty { color: var(--text-faint); font-style: italic; font-size: 12px; }

on":"api.post('/api/v1/auth/sign-in') with credentials: 'include'","evidence":{"path":"apps/web/src/api/client.ts","symbol":"request"}},{"node":"api-server","action":"Routes to auth.SignIn behind a 10-per-10-minutes per-IP limit","evidence":{"path":"apps/api/internal/server/server.go","symbol":"auth.SignIn"}},{"node":"api-handlers","action":"Verifies the password and sets the access_token httpOnly cookie","evidence":{"path":"apps/api/internal/handler/auth.go","symbol":"SignIn"}},{"node":"api-db","action":"Looks up the user and their org","evidence":{"path":"apps/api/internal/db/auth.sql.go","symbol":"GetUserByEmail"}},{"node":"postgres","action":"Returns the stored password hash and org membership","evidence":{"path":"apps/api/migrations/001_initial.sql","symbol":"users"}},{"node":"web-state","action":"auth store records the user; router guards now allow requiresAuth routes","evidence":{"path":"apps/web/src/stores/auth.ts","symbol":"setUser"}},{"node":"web-router","action":"beforeEach redirects to the dashboard (or accept-terms when terms are stale)","evidence":{"path":"apps/web/src/router/index.ts","symbol":"router.beforeEach"}},{"node":"api-middleware","action":"RequireAuth validates the cookie on every subsequent dashboard fetch","evidence":{"path":"apps/api/internal/middleware/auth.go","symbol":"RequireAuth"}}],"outcome":"The browser holds an httpOnly session cookie, the auth store is authenticated, and the dashboard's monitor queries resolve behind RequireAuth."},{"id":"flow-upgrade-plan","name":"Upgrade a plan through Paddle","trigger":"A signed-in user picks a paid plan in the billing screen","steps":[{"node":"web-views","action":"BillingView requests a checkout, then opens the Paddle.js overlay","evidence":{"path":"apps/web/src/views/BillingView.vue","symbol":"initializePaddle"}},{"node":"web-api","action":"POST /api/v1/billing/checkout with the plan and cycle","evidence":{"path":"apps/web/src/api/billing.ts","symbol":"billingApi"}},{"node":"api-server","action":"Routes to billing.CreateCheckout under a 20-per-hour per-org limit","evidence":{"path":"apps/api/internal/server/server.go","symbol":"billing.CreateCheckout"}},{"node":"api-handlers","action":"createPaddleTransaction calls the Paddle API for a transaction id","evidence":{"path":"apps/api/internal/handler/billing.go","symbol":"createPaddleTransaction"}},{"node":"ext-paddle","action":"Paddle runs checkout in the overlay, then posts a signed subscription event to /webhook/paddle","evidence":{"path":"apps/api/internal/handler/billing.go","symbol":"paddleAPIBase"}},{"node":"api-handlers","action":"Webhook verifies the signature and writes the new plan, cycle and Paddle ids","evidence":{"path":"apps/api/internal/handler/billing.go","symbol":"Webhook"}},{"node":"api-db","action":"Updates the org's plan and billing state","evidence":{"path":"apps/api/internal/db/billing.sql.go","symbol":"UpdateOrgPlan"}},{"node":"api-billing","action":"On a downgrade, enforcement pauses monitors and channels above the new caps","evidence":{"path":"apps/api/internal/billing/enforce.go","symbol":"EnforceMonitorLimit"}},{"node":"postgres","action":"Persists plan, subscription ids and any paused resources","evidence":{"path":"apps/api/migrations/026_paddle_billing.sql","symbol":"paddle_subscription_id"}}],"outcome":"The org's plan reflects the Paddle subscription and plan limits are re-enforced; the billing view polls until the webhook lands."},{"id":"flow-public-status","name":"Public status page render","trigger":"Anyone (no session) opens /status/{slug} or embeds /status/{slug}/badge.svg","steps":[{"node":"api-server","action":"Handles /status/{slug} in Go before the SPA catch-all, at 300 req/min per IP","evidence":{"path":"apps/api/internal/server/server.go","symbol":"statusPublic.ServeHTTP"}},{"node":"api-handlers","action":"Loads the page, its monitor rows, and active plus paginated resolved incidents","evidence":{"path":"apps/api/internal/handler/status_public.go","symbol":"loadRows"}},{"node":"api-db","action":"Reads status page config, attached monitors and incident history","evidence":{"path":"apps/api/internal/db/status_pages.sql.go","symbol":"GetStatusPageBySlug"}},{"node":"postgres","action":"Returns page, monitor and incident rows","evidence":{"path":"apps/api/migrations/031_status_page_incidents.sql","symbol":"status_page_incidents"}},{"node":"api-handlers","action":"Renders server-side HTML, or an SVG badge for the badge routes","evidence":{"path":"apps/api/internal/handler/status_public_badges.go","symbol":"renderBadgeSVG"}}],"outcome":"A branded status page (or cache-controlled SVG badge) is served from the same domain, with no authentication and no subdomain."}]}</script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("codemap-data").textContent);
  var NODES = DATA.nodes, EDGES = DATA.edges, FLOWS = DATA.flows;

  var GROUPS = [
    { id: "frontend",  label: "Browser / SPA",   color: "#4fc3f7" },
    { id: "backend",   label: "Go API process",  color: "#a78bfa" },
    { id: "datastore", label: "Data",            color: "#7ee787" },
    { id: "external",  label: "External",        color: "#ffb454" }
  ];
  var GCOLOR = {}; GROUPS.forEach(function (g) { GCOLOR[g.id] = g.color; });
  var ETYPES = ["imports", "calls", "reads", "writes", "publishes", "subscribes"];

  var byId = {}; NODES.forEach(function (n) { byId[n.id] = n; });
  var idx = {}; NODES.forEach(function (n, i) { idx[n.id] = i; });

  // ---------- header ----------
  document.getElementById("m-commit").textContent = DATA.generated_from_commit.slice(0, 12);
  document.getElementById("m-time").textContent = DATA.generated_at;
  document.getElementById("m-scope").textContent = DATA.scope.join(", ");
  document.getElementById("m-counts").textContent =
    NODES.length + " modules · " + EDGES.length + " relationships · " + FLOWS.length + " flows";

  // ---------- layered layout (layering + barycenter ordering) ----------
  // Layers run TOP-TO-BOTTOM: the dependency chain here is 11 deep but at most
  // 4 wide, so laying layers out as columns produced a 2800x230 strip that had
  // to shrink to ~0.45 zoom to fit. Rows give a ~900x1050 shape that fits far
  // better, and it reads the way the system works: browser at the top, Postgres
  // and the external services at the bottom.
  var NW = 196, NH = 56, COLGAP = 222, ROWGAP = 96;

  // Layers run left-to-right. MAXW caps how many modules share a layer: a pure
  // longest-path layering makes this graph an 11-column, 3-row strip that has to
  // shrink to ~0.35 zoom to fit, so list-scheduling into a bounded width keeps
  // the whole system legible on the first screen instead.
  var MAXW = 4;

  function buildLayers(maxWidth) {
    // break cycles with a DFS so layering runs on a DAG
    var out = {}, inc = {};
    NODES.forEach(function (n) { out[n.id] = []; inc[n.id] = []; });
    var state = {}, keep = [];
    NODES.forEach(function (n) { state[n.id] = 0; });
    var adj = {}; NODES.forEach(function (n) { adj[n.id] = []; });
    EDGES.forEach(function (e) { adj[e.from].push(e); });
    function dfs(id) {
      state[id] = 1;
      adj[id].forEach(function (e) {
        if (state[e.to] === 1) return;            // back edge -> drop for layering
        keep.push(e);
        if (state[e.to] === 0) dfs(e.to);
      });
      state[id] = 2;
    }
    NODES.forEach(function (n) { if (state[n.id] === 0) dfs(n.id); });
    keep.forEach(function (e) { out[e.from].push(e.to); inc[e.to].push(e.from); });

    // topological order, group-stable
    var gi = {}; NODES.forEach(function (n) {
      gi[n.id] = GROUPS.findIndex(function (g) { return g.id === n.group; });
    });
    function cmp(a, b) { return gi[a] - gi[b] || a.localeCompare(b); }
    var indeg = {}; NODES.forEach(function (n) { indeg[n.id] = 0; });
    keep.forEach(function (e) { indeg[e.to]++; });
    var q = NODES.filter(function (n) { return indeg[n.id] === 0; }).map(function (n) { return n.id; });
    var topo = [];
    while (q.length) {
      q.sort(cmp);
      var id = q.shift();
      topo.push(id);
      out[id].forEach(function (t) { if (--indeg[t] === 0) q.push(t); });
    }

    // list-schedule into layers no wider than maxWidth, never above a predecessor
    var layer = {}, load = {};
    topo.forEach(function (id) {
      var min = 0;
      inc[id].forEach(function (p) {
        if (layer[p] !== undefined) min = Math.max(min, layer[p] + 1);
      });
      var l = min;
      while ((load[l] || 0) >= maxWidth) l++;
      layer[id] = l;
      load[l] = (load[l] || 0) + 1;
    });
    NODES.forEach(function (n) { if (layer[n.id] === undefined) layer[n.id] = 0; });
    return { layer: layer, out: out, inc: inc };
  }

  var L = buildLayers(MAXW);
  var layerOf = L.layer;
  var maxLayer = 0;
  NODES.forEach(function (n) { maxLayer = Math.max(maxLayer, layerOf[n.id]); });

  var cols = [];
  for (var i = 0; i <= maxLayer; i++) cols.push([]);
  NODES.slice()
    .sort(function (a, b) {
      var ga = GROUPS.findIndex(function (g) { return g.id === a.group; });
      var gb = GROUPS.findIndex(function (g) { return g.id === b.group; });
      return ga - gb || a.id.localeCompare(b.id);
    })
    .forEach(function (n) { cols[layerOf[n.id]].push(n.id); });

  function crossings() {
    var c = 0;
    for (var l = 0; l < cols.length - 1; l++) {
      var pairs = [];
      EDGES.forEach(function (e) {
        var a = cols[l].indexOf(e.from), b = cols[l + 1].indexOf(e.to);
        if (a >= 0 && b >= 0) pairs.push([a, b]);
      });
      for (var i = 0; i < pairs.length; i++)
        for (var j = i + 1; j < pairs.length; j++)
          if ((pairs[i][0] - pairs[j][0]) * (pairs[i][1] - pairs[j][1]) < 0) c++;
    }
    return c;
  }

  function order(sweepDown) {
    var range = sweepDown
      ? cols.map(function (_, i) { return i; })
      : cols.map(function (_, i) { return cols.length - 1 - i; });
    range.forEach(function (l) {
      var ref = sweepDown ? l - 1 : l + 1;
      if (ref < 0 || ref >= cols.length) return;
      var bary = {};
      cols[l].forEach(function (id, pos) {
        var acc = [], gi = GROUPS.findIndex(function (g) { return g.id === byId[id].group; });
        EDGES.forEach(function (e) {
          var other = e.from === id ? e.to : (e.to === id ? e.from : null);
          if (!other) return;
          var p = cols[ref].indexOf(other);
          if (p >= 0) acc.push(p);
        });
        var m = acc.length ? acc.reduce(function (a, b) { return a + b; }, 0) / acc.length : pos;
        // Group index dominates so each group occupies its own vertical band and
        // the boundary boxes never overlap; barycenter only breaks ties inside a
        // group. Trading a few crossings for legible system boundaries.
        bary[id] = gi * 1000 + m;
      });
      cols[l].sort(function (a, b) { return bary[a] - bary[b] || a.localeCompare(b); });
    });
  }

  var best = cols.map(function (c) { return c.slice(); }), bestC = crossings();
  for (var it = 0; it < 24; it++) {
    order(it % 2 === 0);
    var c = crossings();
    if (c < bestC) { bestC = c; best = cols.map(function (x) { return x.slice(); }); }
  }
  cols = best;

  // Columns are allocated per group, not per row position, so every group gets a
  // contiguous vertical band and the boundary boxes stay disjoint.
  var bandWidth = {}, bandStart = {}, used = 0;
  GROUPS.forEach(function (g) {
    var w = 0;
    cols.forEach(function (row) {
      var c = row.filter(function (id) { return byId[id].group === g.id; }).length;
      if (c > w) w = c;
    });
    bandWidth[g.id] = w;
    bandStart[g.id] = used;
    used += w;
  });

  var pos = {};
  cols.forEach(function (row, l) {
    var seen = {};
    row.forEach(function (id) {
      var g = byId[id].group;
      var k = seen[g] || 0;
      seen[g] = k + 1;
      pos[id] = { x: 60 + (bandStart[g] + k) * COLGAP, y: 60 + l * ROWGAP };
    });
  });

  // ---------- render ----------
  var svg = document.getElementById("svg");
  var vp = document.getElementById("viewport");
  var gB = document.getElementById("g-boundaries");
  var gE = document.getElementById("g-edges");
  var gF = document.getElementById("g-flow");
  var gN = document.getElementById("g-nodes");
  var NS = "http://www.w3.org/2000/svg";
  function el(t, a) { var e = document.createElementNS(NS, t); for (var k in a) e.setAttribute(k, a[k]); return e; }

  // boundaries
  var boundaryEls = {};
  GROUPS.forEach(function (g) {
    var r = el("rect", { class: "boundary", stroke: g.color, rx: 14 });
    var t = el("text", { class: "boundary-label", fill: g.color });
    t.textContent = g.label;
    gB.appendChild(r); gB.appendChild(t);
    boundaryEls[g.id] = { rect: r, text: t };
  });
  function layoutBoundaries() {
    GROUPS.forEach(function (g) {
      var ns = NODES.filter(function (n) { return n.group === g.id && !hiddenNodes[n.id]; });
      var b = boundaryEls[g.id];
      if (!ns.length) { b.rect.style.display = "none"; b.text.style.display = "none"; return; }
      b.rect.style.display = ""; b.text.style.display = "";
      var x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
      ns.forEach(function (n) {
        x1 = Math.min(x1, pos[n.id].x); y1 = Math.min(y1, pos[n.id].y);
        x2 = Math.max(x2, pos[n.id].x + NW); y2 = Math.max(y2, pos[n.id].y + NH);
      });
      var p = 11;   // must stay under half the inter-band gap (COLGAP - NW) or boxes collide
      b.rect.setAttribute("x", x1 - p); b.rect.setAttribute("y", y1 - p - 12);
      b.rect.setAttribute("width", x2 - x1 + p * 2); b.rect.setAttribute("height", y2 - y1 + p * 2 + 12);
      b.text.setAttribute("x", x1 - p + 10); b.text.setAttribute("y", y1 - p - 18);
    });
  }

  // edges
  var edgeEls = [];
  EDGES.forEach(function (e, i) {
    var p = el("path", { class: "edge", stroke: "#3f5266", "marker-end": "url(#ah)" });
    var lab = el("text", { class: "edge-label", fill: "#8fa1b3" });
    lab.textContent = e.type;
    gE.appendChild(p); gE.appendChild(lab);
    edgeEls.push({ e: e, path: p, label: lab, i: i });
  });

  function edgeGeom(o) {
    var a = pos[o.e.from], b = pos[o.e.to];
    var down = b.y >= a.y;
    var x1 = a.x + NW / 2, y1 = down ? a.y + NH : a.y;
    var x2 = b.x + NW / 2, y2 = down ? b.y : b.y + NH;
    var dy = Math.max(38, Math.abs(y2 - y1) * 0.45) * (down ? 1 : -1);
    o.path.setAttribute("d", "M" + x1 + "," + y1 + " C" + x1 + "," + (y1 + dy) + " " + x2 + "," + (y2 - dy) + " " + x2 + "," + y2);
    o.label.setAttribute("x", (x1 + x2) / 2);
    o.label.setAttribute("y", (y1 + y2) / 2);
    o.label.setAttribute("text-anchor", "middle");
  }

  // nodes
  var nodeEls = {};
  NODES.forEach(function (n) {
    var g = el("g", { class: "node", "data-id": n.id });
    var col = GCOLOR[n.group] || "#8fa1b3";
    var r = el("rect", { class: "body", width: NW, height: NH, fill: "#141d27", stroke: col });
    var t1 = el("text", { class: "title", x: 12, y: 22 });
    t1.textContent = n.label;
    var t2 = el("text", { class: "role", x: 12, y: 38 });
    t2.textContent = n.role;
    var t3 = el("text", { class: "badge", x: NW - 12, y: 38, "text-anchor": "end" });
    t3.textContent = (n.tests && n.tests.length ? n.tests.length + " tests" : "no tests");
    var dot = el("circle", { cx: NW - 13, cy: 17, r: 4, fill: col, opacity: .9 });
    g.appendChild(r); g.appendChild(dot); g.appendChild(t1); g.appendChild(t2); g.appendChild(t3);
    gN.appendChild(g);
    nodeEls[n.id] = g;
  });

  function place() {
    NODES.forEach(function (n) {
      nodeEls[n.id].setAttribute("transform", "translate(" + pos[n.id].x + "," + pos[n.id].y + ")");
    });
    edgeEls.forEach(edgeGeom);
    layoutBoundaries();
    if (selFlow) drawFlow(selFlow);
  }

  // ---------- pan / zoom ----------
  var view = { x: 0, y: 0, k: 1 };
  function applyView() {
    vp.setAttribute("transform", "translate(" + view.x + "," + view.y + ") scale(" + view.k + ")");
  }
  function fit() {
    var xs = [], ys = [];
    NODES.forEach(function (n) { xs.push(pos[n.id].x, pos[n.id].x + NW); ys.push(pos[n.id].y, pos[n.id].y + NH); });
    var x1 = Math.min.apply(null, xs) - 70, x2 = Math.max.apply(null, xs) + 70;
    var y1 = Math.min.apply(null, ys) - 70, y2 = Math.max.apply(null, ys) + 70;
    var r = svg.getBoundingClientRect();
    // A zero-size canvas (hidden tab, pre-layout) would otherwise set k to 0 and
    // collapse the whole map to a point.
    if (!r.width || !r.height) return;
    view.k = Math.max(0.15, Math.min(r.width / (x2 - x1), r.height / (y2 - y1), 1.5));
    view.x = (r.width - (x2 - x1) * view.k) / 2 - x1 * view.k;
    view.y = (r.height - (y2 - y1) * view.k) / 2 - y1 * view.k;
    applyView();
  }
  svg.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var r = svg.getBoundingClientRect();
    var mx = ev.clientX - r.left, my = ev.clientY - r.top;
    var f = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
    var k = Math.min(3, Math.max(0.2, view.k * f));
    view.x = mx - (mx - view.x) * (k / view.k);
    view.y = my - (my - view.y) * (k / view.k);
    view.k = k; applyView();
  }, { passive: false });
  document.getElementById("zin").onclick = function () { view.k = Math.min(3, view.k * 1.2); applyView(); };
  document.getElementById("zout").onclick = function () { view.k = Math.max(0.2, view.k / 1.2); applyView(); };
  document.getElementById("zfit").onclick = fit;

  var drag = null;
  svg.addEventListener("mousedown", function (ev) {
    var g = ev.target.closest ? ev.target.closest(".node") : null;
    if (g) {
      drag = { kind: "node", id: g.getAttribute("data-id"), sx: ev.clientX, sy: ev.clientY,
               ox: pos[g.getAttribute("data-id")].x, oy: pos[g.getAttribute("data-id")].y, moved: false };
    } else {
      drag = { kind: "pan", sx: ev.clientX, sy: ev.clientY, ox: view.x, oy: view.y, moved: false };
      svg.classList.add("dragging");
    }
  });
  window.addEventListener("mousemove", function (ev) {
    if (!drag) return;
    var dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    if (drag.kind === "pan") { view.x = drag.ox + dx; view.y = drag.oy + dy; applyView(); }
    else { pos[drag.id].x = drag.ox + dx / view.k; pos[drag.id].y = drag.oy + dy / view.k; place(); }
  });
  window.addEventListener("mouseup", function (ev) {
    svg.classList.remove("dragging");
    if (drag && !drag.moved) {
      if (drag.kind === "node") select(drag.id);
      else { select(null); selectFlow(null); }
    }
    drag = null;
  });

  // ---------- filters / search ----------
  var hiddenGroups = {}, hiddenTypes = {}, query = "";
  var hiddenNodes = {};

  var gWrap = document.getElementById("groups");
  GROUPS.forEach(function (g) {
    var n = NODES.filter(function (x) { return x.group === g.id; }).length;
    var l = document.createElement("label"); l.className = "chk";
    l.innerHTML = '<input type="checkbox" checked><span class="swatch" style="background:' + g.color + '"></span>' +
      g.label + ' <span style="color:var(--text-faint)">(' + n + ')</span>';
    l.querySelector("input").onchange = function () { hiddenGroups[g.id] = !this.checked; apply(); };
    gWrap.appendChild(l);
  });

  var tWrap = document.getElementById("etypes");
  ETYPES.forEach(function (t) {
    var n = EDGES.filter(function (e) { return e.type === t; }).length;
    if (!n) return;
    var l = document.createElement("label"); l.className = "chk";
    l.innerHTML = '<input type="checkbox" checked>' + t + ' <span style="color:var(--text-faint)">(' + n + ')</span>';
    l.querySelector("input").onchange = function () { hiddenTypes[t] = !this.checked; apply(); };
    tWrap.appendChild(l);
  });

  document.getElementById("search").addEventListener("input", function () {
    query = this.value.trim().toLowerCase(); apply();
  });

  function haystack(n) {
    return [n.id, n.label, n.role, n.path, n.summary,
            (n.members || []).join(" "), (n.entrypoints || []).join(" "),
            (n.tests || []).join(" "), (n.constraints || []).join(" "),
            (n.evidence || []).map(function (e) { return e.path + " " + e.symbol; }).join(" ")]
      .join(" ").toLowerCase();
  }

  // ---------- selection ----------
  var selNode = null, selFlow = null;

  function upstream(id) { return EDGES.filter(function (e) { return e.to === id; }); }
  function downstream(id) { return EDGES.filter(function (e) { return e.from === id; }); }
  function flowsWith(id) {
    return FLOWS.filter(function (f) { return f.steps.some(function (s) { return s.node === id; }); });
  }

  function apply() {
    hiddenNodes = {};
    NODES.forEach(function (n) { if (hiddenGroups[n.group]) hiddenNodes[n.id] = true; });

    var matched = null;
    if (query) {
      matched = {};
      NODES.forEach(function (n) { if (haystack(n).indexOf(query) >= 0) matched[n.id] = true; });
    }

    var up = {}, down = {}, inflow = {};
    if (selNode) {
      upstream(selNode).forEach(function (e) { up[e.from] = true; });
      downstream(selNode).forEach(function (e) { down[e.to] = true; });
    }
    if (selFlow) selFlow.steps.forEach(function (s) { inflow[s.node] = true; });

    NODES.forEach(function (n) {
      var g = nodeEls[n.id];
      g.classList.toggle("hidden", !!hiddenNodes[n.id]);
      g.classList.toggle("match", !!(matched && matched[n.id]));
      g.classList.toggle("sel", n.id === selNode);
      g.classList.toggle("up", !!up[n.id]);
      g.classList.toggle("down", !!down[n.id]);
      g.classList.toggle("inflow", !!inflow[n.id]);
      var dim = false;
      if (matched && !matched[n.id]) dim = true;
      if (selNode && n.id !== selNode && !up[n.id] && !down[n.id]) dim = true;
      if (selFlow && !inflow[n.id]) dim = true;
      g.classList.toggle("dim", dim);
    });

    edgeEls.forEach(function (o) {
      var e = o.e;
      var hide = hiddenTypes[e.type] || hiddenNodes[e.from] || hiddenNodes[e.to];
      o.path.classList.toggle("hidden", hide);
      o.label.classList.toggle("hidden", hide);
      var isUp = selNode && e.to === selNode;
      var isDown = selNode && e.from === selNode;
      o.path.classList.toggle("up", !!isUp);
      o.path.classList.toggle("down", !!isDown);
      o.path.setAttribute("marker-end", isUp ? "url(#ah-up)" : isDown ? "url(#ah-down)" : "url(#ah)");
      var dim = (selNode && !isUp && !isDown) || (selFlow != null) || (matched != null);
      o.path.classList.toggle("dim", !!dim);
      o.label.classList.toggle("show", !!(isUp || isDown));
    });

    layoutBoundaries();
  }

  function drawFlow(f) {
    gF.innerHTML = "";
    if (!f) return;
    var pts = f.steps.map(function (s) {
      return [pos[s.node].x + NW / 2, pos[s.node].y + NH / 2];
    });
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0] + "," + p[1]; }).join(" ");
    gF.appendChild(el("path", { id: "flowpath", d: d }));
    pts.forEach(function (p, i) {
      var g = el("g", { class: "stepnum", transform: "translate(" + p[0] + "," + (p[1] - NH / 2 - 12) + ")" });
      g.appendChild(el("circle", { r: 9 }));
      var t = el("text", { y: 3.5 }); t.textContent = String(i + 1);
      g.appendChild(t); gF.appendChild(g);
    });
  }

  function select(id) {
    selNode = (id === selNode) ? null : id;
    if (selNode) selFlow = null, drawFlow(null), markFlowBtns();
    apply();
    renderDetail();
  }

  function selectFlow(f) {
    selFlow = (selFlow && f && selFlow.id === f.id) ? null : f;
    if (selFlow) selNode = null;
    drawFlow(selFlow);
    markFlowBtns();
    apply();
    renderDetail();
  }

  // flow buttons
  var fWrap = document.getElementById("flows");
  var flowBtns = {};
  FLOWS.forEach(function (f) {
    var b = document.createElement("button");
    b.className = "flow-btn";
    b.innerHTML = "<span></span><small></small>";
    b.querySelector("span").textContent = f.name;
    b.querySelector("small").textContent = f.steps.length + " steps · " + f.trigger;
    b.onclick = function () { selectFlow(f); };
    fWrap.appendChild(b);
    flowBtns[f.id] = b;
  });
  function markFlowBtns() {
    FLOWS.forEach(function (f) {
      flowBtns[f.id].classList.toggle("on", !!(selFlow && selFlow.id === f.id));
    });
  }

  // ---------- detail panel ----------
  var detail = document.getElementById("detail");
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function list(items, cls) {
    if (!items || !items.length) return '<p class="empty">none</p>';
    return "<ul>" + items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</ul>";
  }

  function renderDetail() {
    if (selFlow) return renderFlowDetail(selFlow);
    if (!selNode) { detail.classList.remove("open"); detail.innerHTML = ""; return; }
    var n = byId[selNode];
    var ups = upstream(n.id), downs = downstream(n.id), fl = flowsWith(n.id);
    var html = '<button id="close">&times;</button>';
    html += "<h3>" + esc(n.label) + "</h3>";
    html += '<div class="sub"><span class="mono">' + esc(n.id) + "</span> · " + esc(n.role) + "</div>";
    html += '<div class="path mono">' + esc(n.path) + "</div>";
    html += "<section><p>" + esc(n.summary) + "</p></section>";

    html += "<section><h4>Upstream callers (" + ups.length + ")</h4>" +
      (ups.length ? ups.map(function (e) {
        return '<span class="pill up" data-go="' + e.from + '">' + esc(byId[e.from].label) + " · " + e.type + "</span>";
      }).join("") : '<p class="empty">none — entrypoint</p>') + "</section>";

    html += "<section><h4>Downstream dependencies (" + downs.length + ")</h4>" +
      (downs.length ? downs.map(function (e) {
        return '<span class="pill down" data-go="' + e.to + '">' + esc(byId[e.to].label) + " · " + e.type + "</span>";
      }).join("") : '<p class="empty">none — leaf</p>') + "</section>";

    html += "<section><h4>Flows (" + fl.length + ")</h4>" +
      (fl.length ? fl.map(function (f) {
        return '<span class="pill flow" data-flow="' + f.id + '">' + esc(f.name) + "</span>";
      }).join("") : '<p class="empty">none</p>') + "</section>";

    html += "<section><h4>Entrypoints</h4>" +
      list((n.entrypoints || []).map(function (e) { return '<span class="mono">' + esc(e) + "</span>"; })) + "</section>";

    html += "<section><h4>Tests (" + (n.tests || []).length + ")</h4>" +
      list((n.tests || []).map(function (t) { return '<span class="mono">' + esc(t) + "</span>"; })) + "</section>";

    html += "<section><h4>Constraints</h4>" + list((n.constraints || []).map(esc)) + "</section>";

    html += "<section><h4>Evidence</h4>" +
      list((n.evidence || []).map(function (e) {
        return e === "unknown" ? "<em>unknown</em>"
          : '<span class="mono">' + esc(e.path) + "</span> → <span class=\"mono\">" + esc(e.symbol) + "</span>";
      })) + "</section>";

    html += "<section><h4>Grouped files (" + (n.members || []).length + ")</h4>" +
      list((n.members || []).map(function (m) { return '<span class="mono">' + esc(m) + "</span>"; })) + "</section>";

    detail.innerHTML = html;
    detail.classList.add("open");
    wireDetail();
  }

  function renderFlowDetail(f) {
    var html = '<button id="close">&times;</button>';
    html += "<h3>" + esc(f.name) + "</h3>";
    html += '<div class="sub">' + f.steps.length + " steps</div>";
    html += "<section><h4>Trigger</h4><p>" + esc(f.trigger) + "</p></section>";
    html += "<section><h4>Path</h4><ul>" + f.steps.map(function (s, i) {
      var ev = s.evidence && s.evidence !== "unknown"
        ? '<br><span class="mono" style="color:var(--text-faint);font-size:11px">' +
          esc(s.evidence.path) + " → " + esc(s.evidence.symbol) + "</span>"
        : '<br><em style="color:var(--text-faint)">unknown</em>';
      return "<li><b>" + (i + 1) + ". </b>" +
        '<span class="pill" data-go="' + s.node + '">' + esc(byId[s.node].label) + "</span><br>" +
        esc(s.action) + ev + "</li>";
    }).join("") + "</ul></section>";
    html += "<section><h4>Outcome</h4><p>" + esc(f.outcome) + "</p></section>";
    detail.innerHTML = html;
    detail.classList.add("open");
    wireDetail();
  }

  function wireDetail() {
    var c = document.getElementById("close");
    if (c) c.onclick = function () { selNode = null; selFlow = null; drawFlow(null); markFlowBtns(); apply(); renderDetail(); };
    Array.prototype.forEach.call(detail.querySelectorAll("[data-go]"), function (p) {
      p.onclick = function () { selFlow = null; drawFlow(null); markFlowBtns(); selNode = null; select(p.getAttribute("data-go")); };
    });
    Array.prototype.forEach.call(detail.querySelectorAll("[data-flow]"), function (p) {
      p.onclick = function () {
        var f = FLOWS.filter(function (x) { return x.id === p.getAttribute("data-flow"); })[0];
        selFlow = null; selectFlow(f);
      };
    });
  }

  // ---------- boot ----------
  place();
  apply();
  fit();
  window.addEventListener("resize", fit);
})();
</script>
</body>
</html>
