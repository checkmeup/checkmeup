# yaml-language-server: $schema=https://raw.githubusercontent.com/bunderlog/hathi/main/schema.json
#
# hathi's settings: every Check is on with its defaults (hathi config --default), but these.

# The commit types in full, so Claude reads the format here through CLAUDE.md (PRD project-setup in
# bunderlog/claude-plugins), and the longest line of a message: 140, the header limit commitlint
# enforced before baloo replaced it.
conventional-commits:
  types: [build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test]
  max-length: 140
