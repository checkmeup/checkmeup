services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/checkmeup:cached
      - ~/.gitconfig:/home/dev/.gitconfig:cached
      - ~/.ssh:/home/dev/.ssh:cached
      - ~/.zsh_history:/home/dev/.zsh_history:cached
      - ~/.claude:/home/dev/.claude:cached
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN_CHECKMEUP}
    command: sleep infinity
    network_mode: service:db

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: checkmeup
      POSTGRES_PASSWORD: checkmeup
      POSTGRES_DB: checkmeup
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5433:5432'

volumes:
  postgres-data:
