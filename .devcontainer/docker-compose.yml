services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/checkmeup:cached
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: checkmeup
      POSTGRES_PASSWORD: checkmeup
      POSTGRES_DB: checkmeup
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkmeup -d checkmeup"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
