name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: checkmeup
          POSTGRES_PASSWORD: checkmeup
          POSTGRES_DB: checkmeup
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://checkmeup:checkmeup@localhost:5432/checkmeup?sslmode=disable
      JWT_SECRET: ci-jwt-secret-not-used-in-production
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true
          cache-dependency-path: apps/api/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install Go tools
        run: |
          go install github.com/jandelgado/gcov2lcov@latest
          go install github.com/pressly/goose/v3/cmd/goose@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run migrations
        run: goose -dir apps/api/migrations postgres "$DATABASE_URL" up

      - name: Lint & test
        run: make test

      - name: Upload coverage to Codacy
        if: ${{ !cancelled() }}
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        continue-on-error: true
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/lcov.info
