name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  release:
    name: Release
    # event == 'push' (not 'pull_request') keeps this from ever running against a
    # fork PR's CI run — this job carries write access + secrets, and checks out
    # main directly below rather than the triggering commit, precisely so a PR
    # (even one whose head branch happens to be named "main") can't get its code
    # executed here. See: https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, required by semantic-release

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to production
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - run: sudo gem install kamal --no-document

      - name: Deploy
        run: kamal deploy
        env:
          # GITHUB_TOKEN gets packages:write from this job's `permissions:` block above,
          # so it can push to ghcr.io/checkmeup/checkmeup without a separate long-lived PAT.
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
          PADDLE_ENVIRONMENT: ${{ secrets.PADDLE_ENVIRONMENT }}
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
          PADDLE_SOLO_PRICE_ID: ${{ secrets.PADDLE_SOLO_PRICE_ID }}
          PADDLE_STARTUP_PRICE_ID: ${{ secrets.PADDLE_STARTUP_PRICE_ID }}
          PADDLE_ENTERPRISE_PRICE_ID: ${{ secrets.PADDLE_ENTERPRISE_PRICE_ID }}
          PADDLE_SOLO_ANNUAL_PRICE_ID: ${{ secrets.PADDLE_SOLO_ANNUAL_PRICE_ID }}
          PADDLE_STARTUP_ANNUAL_PRICE_ID: ${{ secrets.PADDLE_STARTUP_ANNUAL_PRICE_ID }}
          PADDLE_ENTERPRISE_ANNUAL_PRICE_ID: ${{ secrets.PADDLE_ENTERPRISE_ANNUAL_PRICE_ID }}
          VITE_PADDLE_CLIENT_TOKEN: ${{ secrets.VITE_PADDLE_CLIENT_TOKEN }}
          VITE_PADDLE_ENVIRONMENT: ${{ secrets.VITE_PADDLE_ENVIRONMENT }}
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}

      - name: Prune old GHCR image versions
        run: bash scripts/ghcr-clean.sh 5
        env:
          # GITHUB_TOKEN can't delete packages regardless of the permissions:
          # block above (Actions' built-in token is capped there) — this needs
          # a classic PAT with read:packages + delete:packages scope.
          GHCR_CLEANUP_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
