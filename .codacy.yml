---
engines:
  # TSQLLint is SQL Server-specific; this project uses PostgreSQL
  tsqllint:
    enabled: false

exclude_paths:
  - '**/*_test.go'
  - 'docs/**'
  - '**/*.md'
  - '*.md'
  - '**/*.sql'
  # sqlc-generated query/model code (ADR-004) — every file under here starts
  # with "// Code generated by sqlc. DO NOT EDIT." Excluded from coverage and
  # analysis; it's exercised indirectly via internal/handler and
  # internal/worker's integration tests, not directly unit-tested.
  - 'apps/api/internal/db/**'
