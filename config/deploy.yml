service: checkmeup
image: checkmeup/checkmeup

servers:
  - 167.233.116.118

proxy:
  ssl: true
  host: checkmeup.net
  app_port: 8080

registry:
  server: ghcr.io
  username: checkmeup
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    ENV: production
    PORT: "8080"
    BASE_URL: https://checkmeup.net
    APP_URL: https://checkmeup.net
    CORS_ORIGINS: https://checkmeup.net
    MIGRATIONS_DIR: /migrations
    STATIC_DIR: /static
  secret:
    - DATABASE_URL
    - JWT_SECRET
    - TELEGRAM_BOT_TOKEN
    - RESEND_API_KEY
    - TWILIO_ACCOUNT_SID
    - TWILIO_API_KEY_SID
    - TWILIO_API_KEY_SECRET
    - TWILIO_MESSAGING_SERVICE_SID
    - PADDLE_ENVIRONMENT
    - PADDLE_API_KEY
    - PADDLE_WEBHOOK_SECRET
    - PADDLE_SOLO_PRICE_ID
    - PADDLE_STARTUP_PRICE_ID
    - PADDLE_ENTERPRISE_PRICE_ID
    - PADDLE_SOLO_ANNUAL_PRICE_ID
    - PADDLE_STARTUP_ANNUAL_PRICE_ID
    - PADDLE_ENTERPRISE_ANNUAL_PRICE_ID

ssh:
  user: deploy

builder:
  arch: amd64
  # BuildKit generates a provenance attestation by default, which forces the
  # push to be an OCI image *index* (manifest list) even for this single
  # linux/amd64 platform — GitHub's package UI then looks for
  # org.opencontainers.image.description on the index's annotations, not on
  # the inner image's LABEL/config, and shows "No description provided"
  # even though the LABEL is set correctly. Disabling provenance restores a
  # plain single-platform manifest.
  provenance: false
  args:
    APP_VERSION: <%= `git describe --tags --always --dirty 2>/dev/null || echo dev`.strip %>
    VCS_REF: <%= `git rev-parse HEAD 2>/dev/null || echo dev`.strip %>
    BUILD_DATE: <%= Time.now.utc.strftime('%Y-%m-%dT%H:%M:%SZ') %>
    # Paddle's client-side token is public (safe to expose — Paddle.js needs
    # it in the browser bundle either way), so it's fine as a plain build arg
    # rather than a builder secret. Vite only bakes VITE_* vars in at build
    # time, so these have to be threaded through here, not env.clear/secret
    # (which only reach the running container, after the frontend is already
    # built).
    VITE_PADDLE_CLIENT_TOKEN: <%= ENV["VITE_PADDLE_CLIENT_TOKEN"] %>
    VITE_PADDLE_ENVIRONMENT: <%= ENV.fetch("VITE_PADDLE_ENVIRONMENT", "production") %>
    # GTM container ID is public (same posture as the Paddle client token
    # above) — needed here for the same reason, Vite only bakes VITE_* in
    # at build time.
    VITE_GTM_ID: <%= ENV["VITE_GTM_ID"] %>

accessories:
  db:
    image: postgres:17-alpine
    host: 167.233.116.118
    port: "127.0.0.1:5432:5432"
    env:
      secret:
        - POSTGRES_PASSWORD
      clear:
        POSTGRES_USER: checkmeup
        POSTGRES_DB: checkmeup
    directories:
      - data:/var/lib/postgresql/data
